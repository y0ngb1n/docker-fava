name: Publish Docker image

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

env:
  REPOSITORY_NAME: ${{ github.repository }}
  GHCR_IMAGE_NAME: ghcr.io/y0ngb1n/fava
  DOCKERHUB_IMAGE_NAME: y0ngb1n/fava

jobs:
  docker-publish:
    name: Build and Push Docker image
    if: github.repository == 'y0ngb1n/docker-fava'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short git commit SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Set fava version
        run: |
          current_version=v`sed -nr 's/fava==(.*)/\1/p' ./requirements.txt`
          echo "FAVA_VERSION=$(echo $current_version | sed 's/v//g')" >> $GITHUB_ENV

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE_NAME }}:latest
            ${{ env.GHCR_IMAGE_NAME }}:${{ env.FAVA_VERSION }}
            ${{ env.GHCR_IMAGE_NAME }}:${{ env.FAVA_VERSION }}-${{ env.SHORT_SHA }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ env.FAVA_VERSION }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ env.FAVA_VERSION }}-${{ env.SHORT_SHA }}

  announce:
    runs-on: ubuntu-latest
    needs:
    - docker-publish
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📌 Generate release tag
        run: |
          FAVA_VERSION=`sed -nr 's/fava==(.*)/\1/p' ./requirements.txt`
          echo "FAVA_VERSION=$FAVA_VERSION" >> $GITHUB_ENV
          
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          RELEASE_TAG=${FAVA_VERSION}-${SHORT_SHA}
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: 🔌 Plugins
        run: |
          echo "PLUGINS<<EOF" >> $GITHUB_ENV
          cat ./requirements.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 🐳 Images
        run: |
          echo "IMAGES<<EOF" >> $GITHUB_ENV
          echo "${{ env.GHCR_IMAGE_NAME }}:latest" >> $GITHUB_ENV
          echo "${{ env.GHCR_IMAGE_NAME }}:${{ env.FAVA_VERSION }}" >> $GITHUB_ENV
          echo "${{ env.GHCR_IMAGE_NAME }}:${{ env.FAVA_VERSION }}-${{ env.SHORT_SHA }}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "# OR" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "${{ env.DOCKERHUB_IMAGE_NAME }}:latest
          echo "${{ env.DOCKERHUB_IMAGE_NAME }}:${{ env.FAVA_VERSION }}" >> $GITHUB_ENV
          echo "${{ env.DOCKERHUB_IMAGE_NAME }}:${{ env.FAVA_VERSION }}-${{ env.SHORT_SHA }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "DEFAULT_IMAGE=${{ env.GHCR_IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: 📝 Generate release.md
        run: |
          cat <<EOF > release.md
          ## 🔌 Plugins
          \`\`\`
          $PLUGINS
          \`\`\`

          ## 🐳 Container Images
          \`\`\`
          $IMAGES
          \`\`\`

          ## ⚙️ Runtime Env
          \`\`\`
          FAVA_HOST=0.0.0.0
          FAVA_PREFIX=/
          BEANCOUNT_FILE=/ledger/main.beancount
          \`\`\`

          ## 🚀 Quick Start

          \`\`\`bash
          docker run -d \
            -p 5000:5000 \
            -v \$(pwd):/ledger \
            -e BEANCOUNT_FILE=/ledger/main.beancount \
            ghcr.io/y0ngb1n/fava:latest
          \`\`\`

          ## 📝 Notes
          - Fava Web UI for Beancount
          - Auto-generated by GitHub Actions
          EOF

      - name: 🚀 Create Release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Release Fava $RELEASE_TAG" \
            --notes-file release.md